openapi: 3.0.3
info:
  title: AndroBlight API
  description: |
    **AndroBlight** — Android Malware Detection API (CNN-BiLSTM v3)

    Analyse APK files and Play Store packages for malware using a CNN-BiLSTM
    deep-learning model, multi-engine AV enrichment (VirusTotal, Hybrid Analysis,
    MetaDefender), permission-risk scoring, and custom threat rules.

    ## Authentication
    Most endpoints require a **Bearer JWT** token obtained from `POST /auth/login`.
    Include it in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```
  version: "3.1.0"
  contact:
    name: AndroBlight Group-47

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Health
    description: Server health and status
  - name: Auth
    description: Registration, login, token management
  - name: Scan
    description: APK and Play Store malware scanning
  - name: History
    description: Local scan history (server-side filtered view)
  - name: Sync
    description: Cloud sync — push/pull scan history between client and server
  - name: Monitor
    description: Installed-app risk assessment
  - name: Rules
    description: Custom user-defined permission-based threat rules
  - name: Rescan
    description: Background rescanning and verdict-change notifications
  - name: Admin
    description: Cache, stats, reports, AV engine status

# ─────────────────────────────────────────────────────────────────────────────
# Security scheme
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: "s3cretPass!"
        display_name:
          type: string
          example: "Alice"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: "s3cretPass!"

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: user@example.com
        display_name:
          type: string
          example: Alice
        created_at:
          type: string
          format: date-time

    # ── Scan result ───────────────────────────────────────────────────────────
    ScanResult:
      type: object
      properties:
        file_hash:
          type: string
          example: "a1b2c3d4e5f6..."
        label:
          type: string
          enum: [Malware, Benign]
        confidence:
          type: number
          format: float
          example: 0.97
        overall_score:
          type: integer
          example: 72
        threat_level:
          type: string
          enum: [critical, high, medium, low, safe]
        recommendation:
          type: string
        permission_analysis:
          $ref: "#/components/schemas/PermissionAnalysis"
        multi_engine_results:
          type: array
          items:
            $ref: "#/components/schemas/EngineResult"
        device_info:
          $ref: "#/components/schemas/DeviceInfo"
        scan_time:
          type: number
          example: 1.23

    PermissionAnalysis:
      type: object
      properties:
        total_count:
          type: integer
        critical:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"
        high:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"
        medium:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"
        low:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"
        unknown:
          type: array
          items:
            $ref: "#/components/schemas/PermissionEntry"
        suspicious_combos:
          type: array
          items:
            $ref: "#/components/schemas/SuspiciousCombo"
        risk_score:
          type: integer
          minimum: 0
          maximum: 100

    PermissionEntry:
      type: object
      properties:
        permission:
          type: string
          example: android.permission.READ_SMS
        description:
          type: string
        risk:
          type: string

    SuspiciousCombo:
      type: object
      properties:
        threat:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        custom_rule:
          type: boolean
          default: false
        rule_id:
          type: integer

    EngineResult:
      type: object
      properties:
        engine:
          type: string
          example: VirusTotal
        found:
          type: boolean
        malicious:
          type: boolean
        verdict:
          type: string
        detection_ratio:
          type: string
          example: "12/72"
        error:
          type: string

    DeviceInfo:
      type: object
      properties:
        is_rooted:
          type: boolean
        device_model:
          type: string
        android_version:
          type: string

    # ── History / ScanRecord ──────────────────────────────────────────────────
    ScanRecord:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        file_hash:
          type: string
        scan_type:
          type: string
          enum: [apk, playstore]
        identifier:
          type: string
        file_name:
          type: string
        package_name:
          type: string
        file_size:
          type: integer
        label:
          type: string
          enum: [Malware, Benign]
        confidence:
          type: number
        overall_score:
          type: integer
        threat_level:
          type: string
        verdict_changed:
          type: boolean
        verdict_changed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Rules ─────────────────────────────────────────────────────────────────
    ThreatRule:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        name:
          type: string
          example: "Spyware combo"
        permissions:
          type: array
          items:
            type: string
          example:
            - android.permission.READ_SMS
            - android.permission.RECORD_AUDIO
        threat:
          type: string
          example: "Potential Spyware"
        description:
          type: string
          example: "App reads SMS and records audio — common spyware pattern"
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRuleRequest:
      type: object
      required: [name, permissions, threat, description]
      properties:
        name:
          type: string
          example: "Spyware combo"
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          example:
            - android.permission.READ_SMS
            - android.permission.RECORD_AUDIO
        threat:
          type: string
          example: "Potential Spyware"
        description:
          type: string
          example: "App reads SMS and records audio — common spyware pattern"
        is_active:
          type: boolean
          default: true

    UpdateRuleRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        threat:
          type: string
        description:
          type: string
        is_active:
          type: boolean

    # ── Monitor ───────────────────────────────────────────────────────────────
    InstalledAppsRequest:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            type: string
          example:
            - com.google.android.youtube
            - com.suspicious.app

    # ── Errors ────────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid credentials"

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Server health check
      description: Returns model load status, cache size, and uptime information.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  model_loaded:
                    type: boolean
                  cache_size:
                    type: integer
                  version:
                    type: string

  # ── Auth ─────────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using a valid refresh token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        "401":
          description: Invalid or expired refresh token

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated

  # ── Two-Factor Authentication (Chunk 6) ──────────────────────────────────────
  /auth/2fa/status:
    get:
      tags: [Auth]
      summary: Get 2FA enabled status for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 2FA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  two_factor_enabled:
                    type: boolean
        "401":
          description: Not authenticated

  /auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Generate a new TOTP secret and QR provisioning URI
      description: >
        Returns the base32 secret and an `otpauth://` URI suitable for QR display.
        2FA is **not** activated until `/auth/2fa/confirm` is called with a valid OTP.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    example: "JBSWY3DPEHPK3PXP"
                  otpauth_uri:
                    type: string
                    example: "otpauth://totp/AndroBlight:user@example.com?secret=JBSWY3DP&issuer=AndroBlight"
        "401":
          description: Not authenticated

  /auth/2fa/confirm:
    post:
      tags: [Auth]
      summary: Confirm and activate 2FA with first OTP
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "123456"
      responses:
        "200":
          description: 2FA activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid OTP or 2FA not set up
        "401":
          description: Not authenticated

  /auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Complete login by verifying OTP (2FA step 2)
      description: >
        Public endpoint. Requires `pre_auth_token` returned from `POST /auth/login`
        when 2FA is enabled.  Returns full `access_token` + `refresh_token` on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pre_auth_token, otp]
              properties:
                pre_auth_token:
                  type: string
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "654321"
      responses:
        "200":
          description: Login complete — full JWT tokens returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired pre_auth_token or wrong OTP

  /auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable 2FA (requires current password and OTP)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, otp]
              properties:
                password:
                  type: string
                otp:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Invalid OTP or wrong password
        "401":
          description: Not authenticated

  # ── Scan ─────────────────────────────────────────────────────────────────────
  /predict:
    post:
      tags: [Scan]
      summary: Scan an APK file for malware
      description: |
        Uploads an APK file. The backend extracts the manifest, runs the CNN-BiLSTM
        model, scores permissions, and optionally queries multi-engine AV APIs.
        Supports device-context fields for root-adjusted scoring.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The APK file to scan (max 100 MB)
                is_rooted:
                  type: string
                  enum: ["true", "false"]
                  description: Whether the device is rooted (adjusts risk score)
                device_model:
                  type: string
                  example: "Pixel 7"
                android_version:
                  type: string
                  example: "13"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: No file provided or invalid APK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Scan error

  /predict-playstore:
    post:
      tags: [Scan]
      summary: Scan a Play Store package by name or URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                package_name:
                  type: string
                  example: com.google.android.youtube
                url:
                  type: string
                  example: "https://play.google.com/store/apps/details?id=com.example"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Missing package name or URL

  /batch-predict:
    post:
      tags: [Scan]
      summary: Scan multiple APK files in one request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Array of scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanResult"

  # ── History ───────────────────────────────────────────────────────────────────
  /history:
    get:
      tags: [History]
      summary: Get paginated, filtered scan history for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: label
          in: query
          schema:
            type: string
            enum: [Malware, Benign]
        - name: scan_type
          in: query
          schema:
            type: string
            enum: [apk, playstore]
        - name: search
          in: query
          schema:
            type: string
          description: Filter by file name or package name
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, highest_risk]
            default: newest
      responses:
        "200":
          description: Paginated history
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanRecord"
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer

  # ── Sync ─────────────────────────────────────────────────────────────────────
  /sync/history:
    get:
      tags: [Sync]
      summary: Pull scan history from the server
      description: Returns records created or updated after the given timestamp.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: ISO-8601 timestamp; only records newer than this are returned
      responses:
        "200":
          description: Array of scan records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanRecord"

    post:
      tags: [Sync]
      summary: Push local scan history to the server
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  items:
                    $ref: "#/components/schemas/ScanRecord"
      responses:
        "200":
          description: Sync summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushed:
                    type: integer
                  skipped:
                    type: integer

  # ── Monitor ───────────────────────────────────────────────────────────────────
  /monitor/installed-apps:
    post:
      tags: [Monitor]
      summary: Check installed apps for risky or suspicious packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstalledAppsRequest"
      responses:
        "200":
          description: Risk assessment for each package
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      suspicious:
                        type: integer
                      cached_malware:
                        type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        package:
                          type: string
                        risk:
                          type: string
                          enum: [safe, suspicious, malware]
                        reason:
                          type: string

  # ── Rules ─────────────────────────────────────────────────────────────────────
  /rules:
    get:
      tags: [Rules]
      summary: List all custom threat rules for the current user
      description: Returns the user's own rules plus global rules (user_id = NULL).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreatRule"

    post:
      tags: [Rules]
      summary: Create a new custom threat rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rule:
                    $ref: "#/components/schemas/ThreatRule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rules/{rule_id}:
    put:
      tags: [Rules]
      summary: Update a custom threat rule (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  rule:
                    $ref: "#/components/schemas/ThreatRule"
        "403":
          description: Forbidden — not the rule owner
        "404":
          description: Rule not found

    delete:
      tags: [Rules]
      summary: Delete a custom threat rule (owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "403":
          description: Forbidden — not the rule owner
        "404":
          description: Rule not found

  # ── Rescan ────────────────────────────────────────────────────────────────────
  /rescan/updates:
    get:
      tags: [Rescan]
      summary: Get scan records whose verdict changed since a given timestamp
      description: |
        The background scheduler re-checks VirusTotal every 6 hours.
        Poll this endpoint to detect verdict changes for previously safe/malicious apps.
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: "ISO-8601 datetime. Defaults to 24 hours ago if omitted."
          example: "2025-01-15T12:00:00Z"
      responses:
        "200":
          description: Records with changed verdicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScanRecord"
                  count:
                    type: integer
                  since:
                    type: string
                    format: date-time
        "400":
          description: Invalid since parameter format

  /rescan/trigger:
    post:
      tags: [Rescan]
      summary: Manually trigger a VirusTotal rescan of all cached hashes
      description: |
        Runs synchronously in the request. May be slow if the cache is large.
        Normally this runs automatically every 6 hours via APScheduler.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rescan complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stats:
                    type: object
                    properties:
                      checked:
                        type: integer
                      changed:
                        type: integer
                      errors:
                        type: integer
        "500":
          description: Rescan error

  # ── Admin ────────────────────────────────────────────────────────────────────
  /report/{file_hash}:
    get:
      tags: [Admin]
      summary: Download a PDF scan report for a file hash
      parameters:
        - name: file_hash
          in: path
          required: true
          schema:
            type: string
          example: "a1b2c3d4e5f6"
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Report not found

  /stats:
    get:
      tags: [Admin]
      summary: Get backend statistics
      description: Returns total scans, cache hit rate, malware ratio, and model info.
      responses:
        "200":
          description: Statistics object
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_scans:
                    type: integer
                  cache_hits:
                    type: integer
                  malware_count:
                    type: integer
                  benign_count:
                    type: integer
                  model_version:
                    type: string

  /clear-cache:
    post:
      tags: [Admin]
      summary: Clear the scan hash cache
      responses:
        "200":
          description: Cache cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  cleared:
                    type: integer
                    description: Number of entries removed

  /engines:
    get:
      tags: [Admin]
      summary: Get status of enabled AV engines
      description: Returns which of VirusTotal, Hybrid Analysis, and MetaDefender are configured.
      responses:
        "200":
          description: Engine availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  virustotal:
                    type: boolean
                  hybrid_analysis:
                    type: boolean
                  metadefender:
                    type: boolean
